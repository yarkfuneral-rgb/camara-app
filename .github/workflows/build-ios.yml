name: Compilar App iOS

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15

    steps:
      - name: Descargar código
        uses: actions/checkout@v4

      - name: Instalar XcodeGen
        run: brew install xcodegen

      - name: Generar proyecto Xcode
        run: xcodegen generate

      - name: Compilar App iOS
        run: |
          xcodebuild build \
            -project CameraApp.xcodeproj \
            -scheme CameraApp \
            -sdk iphoneos \
            -configuration Release \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            AD_HOC_CODE_SIGNING_ALLOWED=YES

      - name: Crear IPA
        run: |
          mkdir -p Payload
          cp -r build/Build/Products/Release-iphoneos/CameraApp.app Payload/
          zip -r CameraApp.ipa Payload/
          echo "IPA generado correctamente"

      - name: Subir IPA como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: CameraApp-IPA
          path: CameraApp.ipa
          retention-days: 30
