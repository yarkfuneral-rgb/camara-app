name: Compilar App iOS

on:
  push:
    branches: [main]
  workflow_dispatch:   # permite correrlo manualmente desde GitHub

jobs:
  build:
    runs-on: macos-14

    steps:
      - name: Descargar código
        uses: actions/checkout@v4

      - name: Instalar XcodeGen
        run: brew install xcodegen

      - name: Generar proyecto Xcode
        run: xcodegen generate

      - name: Compilar (sin firma)
        run: |
          xcodebuild archive \
            -project CameraApp.xcodeproj \
            -scheme CameraApp \
            -archivePath "$RUNNER_TEMP/CameraApp.xcarchive" \
            -destination "generic/platform=iOS" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            -allowProvisioningUpdates 2>&1 | tail -50

      - name: Crear IPA
        run: |
          cd "$RUNNER_TEMP"
          mkdir -p Payload
          cp -r CameraApp.xcarchive/Products/Applications/CameraApp.app Payload/
          zip -r CameraApp.ipa Payload/
          echo "IPA creado: $(du -sh CameraApp.ipa | cut -f1)"

      - name: Subir IPA como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: CameraApp-IPA
          path: ${{ runner.temp }}/CameraApp.ipa
          retention-days: 30
